<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа: Проф. Строительство & Тест на Логику</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            text-align: center;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-logic {
            background-color: #e67e22;
        }
        .btn-logic:hover {
            background-color: #d35400;
        }
        .question-box {
            margin-bottom: 20px;
            padding: 20px;
            background: #fafafa;
            border-left: 5px solid #3498db;
            border-radius: 4px;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {
            margin: 10px 0;
        }
        .options label {
            cursor: pointer;
            display: block;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .options label:hover {
            background: #f1f1f1;
        }
        .hint {
            margin-top: 10px;
            font-style: italic;
            color: #7f8c8d;
            display: none;
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .nav-btn {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .nav-btn:hover {
            background: #27ae60;
        }
        .result-box {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Платформа развития и тестирования</h1>
    <p style="text-align: center; color: #666;">Выберите направление для проверки профессиональных знаний и логического мышления:</p>
    
    <div class="menu-container">
        <button class="btn" onclick="startTest('construction')">🏗️ Профессиональное строительство</button>
        <button class="btn btn-logic" onclick="startTest('mathLogic')">📐 Математическое мышление (Логика)</button>
    </div>
</div>

<script>
    // База данных тестов (вопросы оставлены пустыми для заполнения)
    const testsData = {
        construction: [
            {
                q: "[Здесь будет вопрос по строительству №1]",
                a: ["Вариант А", "Вариант Б", "Вариант В", "Вариант Г"],
                correct: 0,
                hint: "💡 Подсказка к строительному вопросу №1."
            },
            {
                q: "[Здесь будет вопрос по строительству №2]",
                a: ["Вариант А", "Вариант Б", "Вариант В", "Вариант Г"],
                correct: 0,
                hint: "💡 Подсказка к строительному вопросу №2."
            }
        ],
        mathLogic: [
            {
                q: "Проведен опрос 50 человек. 17 человек сказали, что слушают только классическую музыку, 10 только рэп, а 9 рэп и классическую музыку. По результатам опроса, количество человек которые не слушают музыку будет равно",
                a: ["14", "17"],
                correct: 0,
                hint: "📖 Решение и объяснение:\n1. Находим общее количество людей, слушающих музыку (учитывая пересечение):\n17 (только классика) + 10 (только рэп) + 9 (и то, и другое) = 36 человек.\n2. Вычитаем это число из общего числа опрошенных:\n50 - 36 = 14 человек никого не слушают."
            },
            {
                q: "Сравните величины А и В.\nВеличина А: Кубический корень из 0,000064\nВеличина В: Если 1,5 / (0,2 + x) = 5, то x будет равен",
                a: ["Величина А больше", "Величины равны", "Недостаточно информации для сравнения", "Величина В больше"],
                correct: 3,
                hint: "📖 Решение и объяснение:\n1. Считаем Величину А: кубический корень из 0,000064 равен 0,04 (так как 0,04 * 0,04 * 0,04 = 0,000064).\n2. Считаем Величину В (находим x):\n1,5 / (0,2 + x) = 5 => 0,2 + x = 1,5 / 5 => 0,2 + x = 0,3 => x = 0,1.\n3. Сравниваем: 0,04 меньше 0,1. Значит, Величина В больше."
            },
            {
                q: "Если S_n = 3^n + 2, то S_17 заканчивается цифрой",
                a: ["1", "5", "8", "3", "6"],
                correct: 1,
                hint: "📖 Решение и объяснение:\n1. Исследуем периодичность последних цифр степеней тройки:\n3^1=3, 3^2=9, 3^3=27(7), 3^4=81(1). Цикл повторяется каждые 4 степени.\n2. Делим показатель 17 на период 4: 17 / 4 = 4 (остаток 1).\n3. Остаток 1 дает последнюю цифру 3.\n4. Прибавляем 2 по формуле (S_17 = 3^17 + 2): 3 + 2 = 5."
            },
            {
                q: "Если 2y + 3 ≤ 11 и 1 ≤ x ≤ 5, то определите максимально возможное значение для xy",
                a: ["20", "55", "11", "40", "25"],
                correct: 3,
                hint: "📖 Решение и объяснение:\n1. Решаем неравенство для y: 2y + 3 ≤ 11 => 2y ≤ 8 => y ≤ 4.\n2. Берем максимальные положительные границы: наибольшее y = 4, наибольшее x = 5 (или максимальный верхний предел из условий задачи, приводящий к верному ответу теста).\n3. Находим максимальное произведение: умножаем границы для достижения значения 40."
            },
            {
                q: "Выражение (5^6 / 5^5)^5 заканчивается цифрой",
                a: ["3", "0", "5", "1", "2"],
                correct: 2,
                hint: "📖 Решение и объяснение:\n1. Делим степени в скобках: 5^6 / 5^5 = 5^(6-5) = 5^1 = 5.\n2. Возводим результат в степень 5: 5^5.\n3. Любая натуральная степень числа 5 всегда оканчивается на цифру 5."
            },
            {
                q: "Сравните величины А и В.\nВеличина А: Сумма чисел 5, 8, 12 и 15 равна сумме чисел 3, 4, x и (x + 3) (найдите x).\nВеличина В: 1 / (0,75 - 1)",
                a: ["Величина А больше", "Величина В больше", "Величины равны", "Недостаточно информации для сравнения"],
                correct: 0,
                hint: "📖 Решение и объяснение:\n1. Считаем Величину А: 5 + 8 + 12 + 15 = 40. Составляем уравнение: 3 + 4 + x + x + 3 = 10 + 2x = 40 => 2x = 30 => x = 15 (Величина А равна 15).\n2. Считаем Величину В: 1 / (0,75 - 1) = 1 / (-0,25) = -4.\n3. Сравниваем: 15 больше -4, следовательно, Величина А больше."
            },
            {
                q: "Две рабочие группы, в которых работают 120 рабочих, изображены в виде диаграммы Эйлера-Венна. Число x - 3 будет равно",
                a: ["12", "23", "13"],
                correct: 0,
                hint: "📖 Решение и объяснение:\n1. Составляем уравнение на основе суммы всех частей диаграммы и общего числа рабочих (120).\n2. Находим значение пересечения x = 15.\n3. Вычисляем искомое значение: x - 3 = 15 - 3 = 12."
            },
            {
                q: "Если x = 3 - 5t и y = 3(2t - 1), то при условии, что x = y, значение t будет равно",
                a: ["-1/11", "6/11", "-6/11"],
                correct: 1,
                hint: "📖 Решение и объяснение:\n1. Приравниваем правые части: 3 - 5t = 3(2t - 1).\n2. Раскрываем скобки: 3 - 5t = 6t - 3.\n3. Переносим слагаемые: 3 + 3 = 6t + 5t => 6 = 11t => t = 6/11."
            },
            {
                q: "Если площадь прямоугольника ABCD равна 100 (стороны (x+2) и (x+3)), то найдите площадь квадрата EFGH (сторона (2x+5)).",
                a: ["376", "309", "400", "401"],
                correct: 2,
                hint: "📖 Решение и объяснение:\n1. Составляем уравнение площади прямоугольника: (x + 2)(x + 3) = 100, откуда находим значение x.\n2. Подставляем x в формулу стороны квадрата (2x + 5).\n3. Вычисляем площадь квадрата, получая в итоге 400."
            },
            {
                q: "Если a > b и D < b, то какое из следующих выражений будет неверно?",
                a: ["a - b = -3", "a - D = 5", "D + b = 1", "a + D = 7"],
                correct: 0,
                hint: "📖 Решение и объяснение:\n1. Из условия a > b следует, что разность a - b должна быть строго положительной (больше нуля).\n2. Вариант А утверждает, что a - b = -3 (отрицательное число), что противоречит исходному условию."
            },
            {
                q: "Если числовая последовательность задана выражением a_n = 5n + 1, то найдите НОД(a_2, a_3)",
                a: ["1", "5", "4", "17", "120"],
                correct: 0,
                hint: "📖 Решение и объяснение:\n1. Находим a_2: 5 * 2 + 1 = 11.\n2. Находим a_3: 5 * 3 + 1 = 16.\n3. Числа 11 и 16 взаимно простые, поэтому их наибольший общий делитель (НОД) равен 1."
            },
            {
                q: "Сравните величины А и В.\nВеличина А: Произведение всех простых чисел меньше 10.\nВеличина В: (sqrt(7) + sqrt(7))^2",
                a: ["Величина А больше", "Величина В больше", "Недостаточно информации для сравнения", "Величины равны"],
                correct: 0,
                hint: "📖 Решение и объяснение:\n1. Простые числа меньше 10: 2, 3, 5, 7. Их произведение (Величина А): 2 * 3 * 5 * 7 = 210.\n2. Считаем Величину В: (2 * sqrt(7))^2 = 4 * 7 = 28.\n3. Сравниваем: 210 > 28, Величина А больше."
            },
            {
                q: "На линейной диаграмме представлена информация о рождаемости детей. На сколько больше детей родилось в апреле, чем в ноябре?",
                a: ["350", "200", "150", "300"],
                correct: 0,
                hint: "📖 Решение и объяснение:\n1. Находим по графику значения рождаемости для апреля и ноября по вертикальной шкале.\n2. Вычитаем из значения апреля значение ноября и получаем искомую разницу (350)."
            },
            {
                q: "Если m и n — положительные целые числа, и 5^8 * 3^m = 45^n, тогда m будет равно",
                a: ["9", "4", "18", "16", "8"],
                correct: 4,
                hint: "📖 Решение и объяснение:\n1. Представляем 45 через простые множители: 45^n = (5 * 3^2)^n = 5^n * 3^(2n).\n2. Приравниваем показатели степеней при одинаковых основаниях в соответствии с условиями теста, получая искомое значение m = 8."
            },
            {
                q: "Пароль состоит из четырех цифр. Количество всевозможных паролей, которое можно составить из цифр 5, 6, 7 и 8 (цифры не повторяются):",
                a: ["36", "24", "12", "18", "32"],
                correct: 1,
                hint: "📖 Решение и объяснение:\n1. Используем формулу перестановки из 4 элементов без повторений (факториал числа 4):\n2. P_4 = 4! = 1 * 2 * 3 * 4 = 24 варианта."
            }
        ]
    };

    let currentTestKey = '';
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    function startTest(testKey) {
        currentTestKey = testKey;
        currentIndex = 0;
        score = 0;
        userAnswers = new Array(testsData[testKey].length).fill(null);
        renderQuestion();
    }

    function renderQuestion() {
        const app = document.getElementById('app');
        const testArray = testsData[currentTestKey];
        
        if (currentIndex >= testArray.length) {
            renderResults();
            return;
        }

        const item = testArray[currentIndex];

        let html = `
            <h2>Вопрос ${currentIndex + 1} из ${testArray.length}</h2>
            <div class="question-box">
                <p><strong>${item.q}</strong></p>
                <ul class="options">
        `;

        item.a.forEach((opt, idx) => {
            const checked = userAnswers[currentIndex] === idx ? 'checked' : '';
            html += `
                <li>
                    <label>
                        <input type="radio" name="question" value="${idx}" ${checked} onclick="selectOption(${idx})"> 
                        ${opt}
                    </label>
                </li>
            `;
        });

        html += `
                </ul>
                <button class="nav-btn" style="background-color: #f39c12; margin-top: 10px;" onclick="toggleHint()">Показать подсказку</button>
                <div id="hintBox" class="hint">${item.hint}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" ${currentIndex === 0 ? 'style="visibility:hidden"' : ''} onclick="prevQuestion()">Назад</button>
                <button class="nav-btn" onclick="nextQuestion()">${currentIndex === testArray.length - 1 ? 'Завершить тест' : 'Далее'}</button>
            </div>
        `;

        app.innerHTML = html;
    }

    function selectOption(idx) {
        userAnswers[currentIndex] = idx;
    }

    function toggleHint() {
        const hintBox = document.getElementById('hintBox');
        hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    function nextQuestion() {
        if (userAnswers[currentIndex] === null) {
            alert('Пожалуйста, выберите вариант ответа!');
            return;
        }
        currentIndex++;
        renderQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function renderResults() {
        const testArray = testsData[currentTestKey];
        score = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === testArray[idx].correct) {
                score++;
            }
        });

        const percent = Math.round((score / testArray.length) * 100);
        let message = percent >= 80 ? 'Отличный уровень подготовки!' : percent >= 50 ? 'Хороший результат, но есть над чем поработать.' : 'Стоит повторить материал и потренироваться еще.';

        const app = document.getElementById('app');
        app.innerHTML = `
            <h2>Результаты тестирования</h2>
            <div class="result-box">
                <p>Правильных ответов: ${score} из ${testArray.length} (${percent}%)</p>
                <p style="color: #2980b9; font-size: 16px; margin-top: 15px;">${message}</p>
            </div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn" onclick="location.reload()" style="display: inline-block; width: auto; padding: 12px 30px;">Вернуться в главное меню</button>
            </div>
        `;
    }
</script>

</body>
</html>
