                hint: "📖 Как решать (Сравнение двух текстов):\n1. Ищите общее ядро. Галилей защищал систему Коперника, а Ньютон вывел законы движения для нее. Общее для обоих — поддержка гелиоцентризма."
            },
            {
                q: "(Тексты о Галилее и Ньютоне) Подстиль и лексика обоих текстов:",
                a: ["разговорно-бытовая лексика", "специальная терминологическая лексика (физика, астрономия)", "сниженный сленг"],
                correct: 1,
                hint: "📖 Решение и объяснение:\n1. Тексты про ученых и законы вселенной обязательно наполнены научными терминами (оптика, механика, тяготение)."
            },
            {
                q: "(Текст-определение: «Киноискусство — это...») С функционально-стилистической точки зрения текст относится:",
                a: ["к научному стилю", "к художественному стилю", "к разговорному стилю"],
                correct: 0,
                hint: "📖 Как решать (Стили речи):\n1. Строгая формула «Понятие — это...» плюс строгая логичность и отсутствие эмоций — главный признак научного стиля."
            }
        ]
    };

if(testsData.materials && typeof testsData.materials[0].a === 'string') {
        testsData.materials = testsData.materials.map(item => ({
            q: item.q,
            a: [item.a, "Альтернативный вариант Б", "Альтернативный вариант В", "Альтернативный вариант Г"],
            correct: 0,
            hint: "📖 Объяснение к вопросу: " + item.a
        }));
    }

    let currentTestKey = '';
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    function startTest(testKey) {
        currentTestKey = testKey;
        currentIndex = 0;
        score = 0;
        userAnswers = new Array(testsData[testKey].length).fill(null);
        renderQuestion();
    }

    function renderQuestion() {
        const app = document.getElementById('app');
        const testArray = testsData[currentTestKey];
        
        if (currentIndex >= testArray.length) {
            renderResults();
            return;
        }

        const item = testArray[currentIndex];

        let html = `
            <h2>Вопрос ${currentIndex + 1} из ${testArray.length}</h2>
            <div class="question-box">
                <p><strong>${item.q}</strong></p>
                <ul class="options">
        `;

        item.a.forEach((opt, idx) => {
            const checked = userAnswers[currentIndex] === idx ? 'checked' : '';
            html += `
                <li>
                    <label>
                        <input type="radio" name="question" value="${idx}" ${checked} onclick="selectOption(${idx})"> 
                        ${opt}
                    </label>
                </li>
            `;
        });

        html += `
                </ul>
                <button class="nav-btn" style="background-color: #f39c12; margin-top: 10px;" onclick="toggleHint()">Показать решение / объяснение</button>
                <div id="hintBox" class="hint">${item.hint}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" ${currentIndex === 0 ? 'style="visibility:hidden"' : ''} onclick="prevQuestion()">Назад</button>
                <button class="nav-btn" onclick="nextQuestion()">${currentIndex === testArray.length - 1 ? 'Завершить тест' : 'Далее'}</button>
            </div>
        `;

        app.innerHTML = html;
    }

    function selectOption(idx) {
        userAnswers[currentIndex] = idx;
    }

    function toggleHint() {
        const hintBox = document.getElementById('hintBox');
        hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    function nextQuestion() {
        if (userAnswers[currentIndex] === null) {
            alert('Пожалуйста, выберите вариант ответа!');
            return;
        }
        currentIndex++;
        renderQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function renderResults() {
        const testArray = testsData[currentTestKey];
        score = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === testArray[idx].correct) {
                score++;
            }
        });

        const percent = Math.round((score / testArray.length) * 100);
        let message = percent >= 80 ? 'Отличный уровень подготовки!' : percent >= 50 ? 'Хороший результат, но есть над чем поработать.' : 'Стоит повторить материал и потренироваться еще.';

        const app = document.getElementById('app');
        app.innerHTML = `
            <h2>Результаты тестирования</h2>
            <div class="result-box">
                <p>Правильных ответов: ${score} из ${testArray.length} (${percent}%)</p>
                <p style="color: #2980b9; font-size: 16px; margin-top: 15px;">${message}</p>
            </div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn" onclick="location.reload()" style="display: inline-block; width: auto; padding: 12px 30px;">Вернуться в главное меню</button>
            </div>
        `;
    }
</script>

</body>
</html>
